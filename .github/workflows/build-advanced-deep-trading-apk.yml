name: Build Advanced Deep Trading APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'advanced-deep-trading-apk/**'
      - '.github/workflows/build-advanced-deep-trading-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build APK
        working-directory: advanced-deep-trading-apk
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-deep-trading-debug-apk
          path: advanced-deep-trading-apk/app/build/outputs/apk/debug/app-debug.apk
