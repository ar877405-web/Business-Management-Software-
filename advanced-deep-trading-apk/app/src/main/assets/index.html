<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;margin:0;background:#0b1220;color:#e5e7eb}header{padding:20px;background:#111827}h1{margin:0;font-size:22px}.wrap{padding:15px}.card{background:#111827;border:1px solid #263449;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:white}button{background:#2563eb;border:0;font-weight:bold}.hint{color:#94a3b8;font-size:12px}.metric{font-size:24px;font-weight:bold}.good{color:#4ade80}.bad{color:#fb7185}</style></head><body><header><h1>Advanced Deep Trading</h1><div class="hint">Offline quantitative analysis</div></header><div class="wrap"><div class="card"><b>CSV Market Data</b><p class="hint">Import CSV containing a close column.</p><input id="file" type="file" accept=".csv"><div id="status" class="hint">No dataset loaded.</div></div><div class="card"><b>Indicators</b><div class="grid"><div><span class="hint">EMA 20</span><div id="e20" class="metric">—</div></div><div><span class="hint">EMA 50</span><div id="e50" class="metric">—</div></div><div><span class="hint">RSI 14</span><div id="rsi" class="metric">—</div></div><div><span class="hint">MACD</span><div id="macd" class="metric">—</div></div></div></div><div class="card"><b>Signal</b><div id="sig" class="metric">WAIT</div><p class="hint">Paper/educational analysis only. Not financial advice.</p></div><div class="card"><b>Risk Calculator</b><div class="grid"><input id="price" type="number" value="100" placeholder="Price"><input id="acct" type="number" value="1000" placeholder="Account"><input id="risk" type="number" value="1" placeholder="Risk %"><input id="sl" type="number" value="2" placeholder="SL %"></div><button onclick="calc()">Calculate</button><div id="out" class="hint"></div></div></div><script>let a=[];function ema(x,n){if(!x.length)return 0;let k=2/(n+1),e=x[0];for(let i=1;i<x.length;i++)e=x[i]*k+e*(1-k);return e}function rsi(x,n=14){if(x.length<=n)return 0;let g=0,l=0;for(let i=1;i<=n;i++){let d=x[i]-x[i-1];g+=Math.max(d,0);l+=Math.max(-d,0)}let ag=g/n,al=l/n;for(let i=n+1;i<x.length;i++){let d=x[i]-x[i-1];ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n}return al?100-100/(1+ag/al):100}function analyze(){if(!a.length)return;let e20=ema(a,20),e50=ema(a,50),r=rsi(a),m=a.length>26?ema(a,12)-ema(a,26):0;$('e20').textContent=e20.toFixed(4);$('e50').textContent=e50.toFixed(4);$('rsi').textContent=r.toFixed(2);$('macd').textContent=m.toFixed(4);let s=(e20>e50?1:-1)+(r<30?1:r>70?-1:0)+(m>0?1:-1);let q=s>=2?'BUY':s<=-2?'SELL':'WAIT';$('sig').textContent=q;$('sig').className='metric '+(q==='BUY'?'good':q==='SELL'?'bad':'')}function $(x){return document.getElementById(x)}$('file').onchange=async e=>{let t=await e.target.files[0].text(),ls=t.trim().split(/\r?\n/),h=ls.shift().split(',').map(x=>x.trim().toLowerCase()),i=h.indexOf('close');a=ls.map(x=>parseFloat(x.split(',')[i])).filter(Number.isFinite);$('status').textContent='Loaded '+a.length+' prices';analyze()};function calc(){let p=+price.value,ac=+acct.value,r=+risk.value,s=+sl.value,rc=ac*r/100,lp=p*s/100,q=rc/lp;$('out').innerHTML='Risk: $'+rc.toFixed(2)+'<br>Position units: '+q.toFixed(4)+'<br>Stop: $'+(p-lp).toFixed(4)+'<br>2R Target: $'+(p+2*lp).toFixed(4)}</script></body></html>
